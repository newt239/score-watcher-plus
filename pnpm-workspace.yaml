packages:
  - "."
saveExact: true
minimumReleaseAge: 10080
minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - "@pnpm/exe.*"
allowBuilds:
  "@sentry/cli": false
  esbuild: false
  lefthook: true
  sharp: false
  # workerd は Workers ランタイム本体のバイナリを postinstall で展開するため実行が必須
  workerd: true

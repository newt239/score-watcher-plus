packages:
  - "."
saveExact: true
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@tanstack/react-table@9.0.0"
  - "@tanstack/table-core@9.0.0"
allowBuilds:
  "@sentry/cli": false
  esbuild: false
  lefthook: false
  sharp: false
  # workerd は Workers ランタイム本体のバイナリを postinstall で展開するため実行が必須
  workerd: true

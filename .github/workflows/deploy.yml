name: Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      has-secrets: ${{ steps.check.outputs.has }}
    steps:
      - name: CloudflareのSecretsが設定されているか確認
        id: check
        run: echo "has=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

  deploy:
    # Secretsが未設定のリポジトリではスキップする
    needs: check-secrets
    if: needs.check-secrets.outputs.has-secrets == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      # VITE_ の値はビルド時にクライアントへ埋め込まれるため、ここで渡す必要がある
      VITE_APP_URL: ${{ secrets.VITE_APP_URL }}
      VITE_APP_VERSION: ${{ secrets.VITE_APP_VERSION }}
      VITE_GTM_ID: ${{ secrets.VITE_GTM_ID }}
      VITE_GA_ID: ${{ secrets.VITE_GA_ID }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - run: corepack enable
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: ".node-version"
          cache: "pnpm"
      - name: 依存関係をインストール
        run: pnpm install --frozen-lockfile
      - name: ビルド
        run: pnpm run build
      - name: Cloudflare Workersへデプロイ
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

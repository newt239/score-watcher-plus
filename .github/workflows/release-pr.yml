name: Release PR

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  create-release-pr:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト（main最新・全履歴）
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: release との差分を確認
        id: diff
        run: |
          git fetch origin main release --quiet
          if git diff --quiet origin/release origin/main; then
            echo "has_diff=false" >> "$GITHUB_OUTPUT"
            echo "release は main と同一のため、リリースPRの作成をスキップします。"
          else
            echo "has_diff=true" >> "$GITHUB_OUTPUT"
          fi

      - name: PR本文を生成
        if: steps.diff.outputs.has_diff == 'true'
        run: |
          {
            echo "## デプロイ内容"
            echo ""
            echo "\`main\` を \`release\` にマージし、本番（plus.score-watcher.com）へデプロイします。"
            echo ""
            echo "### コミット一覧"
            echo ""
            git log --pretty=format:'- %s (%h)' origin/release..origin/main
            echo ""
            echo ""
            echo "### 変更ファイル"
            echo ""
            echo '```'
            git diff --stat origin/release origin/main
            echo '```'
          } > pr-body.md

      - name: リリースPRを作成または更新
        if: steps.diff.outputs.has_diff == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="リリース: main を release に反映"
          existing=$(gh pr list --base release --head main --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body-file pr-body.md
            echo "既存のリリースPR #$existing を更新しました。"
          else
            gh pr create --base release --head main --title "$title" --body-file pr-body.md
          fi

name: Playwright Tests
on:
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      has-secrets: ${{ steps.check.outputs.has }}
    steps:
      - name: Turso等のSecretsが設定されているか確認
        id: check
        run: echo "has=${{ secrets.TURSO_DATABASE_URL != '' }}" >> "$GITHUB_OUTPUT"
  test:
    # Secretsが未設定のリポジトリではスキップする
    needs: check-secrets
    if: needs.check-secrets.outputs.has-secrets == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      # workerd ランタイムにシェルのprocess.env（=下記secret）を取り込ませる。
      # ローカルは .env から読むが、CIには .env が無いためこのフラグが必須
      CLOUDFLARE_INCLUDE_PROCESS_ENV: "true"
      VITE_APP_VERSION: ${{ secrets.VITE_APP_VERSION }}
      VITE_GTM_ID: ${{ secrets.VITE_GTM_ID }}
      VITE_GA_ID: ${{ secrets.VITE_GA_ID }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: "package.json"
          cache: "pnpm"
      - name: 依存関係をインストール
        run: pnpm install
      - name: Playwrightのバージョンを取得し、ブラウザのキャッシュキーを生成
        id: version-checker
        run: |
          echo "playwright-version=$(npx playwright --version | sed 's/ //g')" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: ブラウザのキャッシュを復元
        id: restore-chromium
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.version-checker.outputs.playwright-version }}
          restore-keys: |
            playwright-chromium-
      - name: もしブラウザのキャッシュがなければインストール
        run: pnpm exec playwright install --with-deps chromium
        if: ${{ steps.restore-chromium.outputs.cache-hit != 'true' }}
      - name: ブラウザのキャッシュを保存
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ steps.restore-chromium.outputs.cache-hit != 'true' }}
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.version-checker.outputs.playwright-version }}
      - name: ビルドが通ることを確認
        run: pnpm run build
      - name: Playwrightのテストを実行
        run: pnpm exec playwright test --workers=2
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
